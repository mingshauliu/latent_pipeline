data:
  suites:
  - IllustrisTNG
  - Astrid
  - SIMBA
  nbody_path_tmpl: /mnt/home/camels/ceph/PUBLIC_RELEASE/CMD/3D_grids/data/Nbody/Grids_Mtot_Nbody_{suite}_LH_128_z=0.0.npy
  mgas_path_tmpl: /mnt/ceph/users/camels/PUBLIC_RELEASE/CMD/3D_grids/data/{suite}/Grids_Mgas_{suite}_LH_128_z=0.0.npy
  param_path_tmpl: /mnt/ceph/users/camels/PUBLIC_RELEASE/CMD/3D_grids/data/{suite}/params_LH_{suite}.txt
  use_cache: true
  cache_dir: /mnt/ceph/users/mliu1/latent_pipeline_cache/L25_LH_128_norm
  norm3d_path: /mnt/home/mliu1/ceph/norm3d.npy
  n_cosmo: 2
  resolution: 128
  crop_size: null
  clamp_val: 10
  box_size: 25
  val_split: 0.2
  stats_n_sample: 96
  # FULL multi-task: input [nbody_density, nbody_vel] -> output [Mgas, ne, T] (encoder3D parity).
  #   use_velocity   -> N-body VELOCITY conditioning input (NbodyVel_norm cache; --with_vel)
  #   target_fields  -> ordered extra OUTPUT targets (Ne_norm --with_ne, T_norm --with_temp)
  # Mgas is always channel 0. in_channels = out_channels(3 = x_t) + nbody(1) + vel(1) = 5.
  # Static input = N-body ONLY; Mgas is generated (flow state x_t), not a static input.
  use_velocity: true
  target_fields: [ne, T]
model:
  in_channels: 5       # [x_t(3 = Mgas,ne,T), nbody(1), vel(1)]
  base_channels: 128
  out_channels: 3      # (Mgas, ne, T)
  cosmo_dim: 2
  latent_dim: 8
  variational: false
  latent_head: mlp     # encoder3D ResNetBranch head: Linear->SiLU->Linear, NO tanh.
  encoder_base: 40     # ~param-matched to encoder3D ResNetBranch. Encoder trains FRESH
                       # (base != ep486's 16); 3-ch (Mgas,ne,T) encode = full feedback
                       # signal -> the bet to break the eff-dim 1.0/8 collapse seen with
                       # gas+ne alone.
  encoder_dropout: 0.1
  circular_padding: true
  norm_type: pixel
training:
  max_epochs: 150
  batch_size: 2
  noise_std: 0.1
  time_sampling: logitnormal
  lr: 0.0002
  weight_decay: 0.001
  gradient_checkpointing: false
  gradient_clip: 1.0
  scheduler: cosine
  warmup_epochs: 5
  accumulate_grad: 8
  precision: bf16-mixed
  devices: 1
  strategy: ddp
  num_workers: 4
  prefetch_factor: 2
  save_top_k: 3
  log_every_n_steps: 50
  xcorr_every_n_epochs: 5
  tsne_n_batches: 16        # encode first 16 val batches' (Mgas,ne,T) -> 8-dim -> t-SNE at
                            # each xcorr epoch; titled eff-dim. THE success metric (>1.0).
  tsne_out_dir: experiments/ne_vel_T/tsne
  xcorr_num_steps: 50
  xcorr_method: euler
  skip_nan_loss: true
  loss_spike_thresh: 5.0
  kl_beta: 0.001
  kl_warmup_epochs: 30
  kl_free_bits: 0.5
  # warm-start UNet backbone from dim8 best ep486 (single-channel, in=2). init_strict:false
  # -> warm_load_partial: enc1 input 2->5 (role-remap: Mgas x_t + nbody cols kept; new ne/T
  # x_t + vel cols fresh), out_conv 1->3 (ne+T rows zero-init), encoder FRESH (base 16->40,
  # 3-ch stem). Do NOT warm-start the encoder from the collapsed ne_vel ckpt.
  init_strict: false
  seed: 42
  resume_from: null
  wandb_project: latent-pipeline-nevelT
  ema:
    enabled: true
    decay: 0.9999
    warmup_steps: 5000
  init_from: latent-pipeline/ffdsq458/checkpoints/best-epoch=486-val_loss=0.012231.ckpt
  cosine_t_max: 150
  eta_min: 1.0e-06
inference:
  checkpoint: null
  num_steps: 50
  method: dopri5
  offload_skips: false
  latent_mode: mean
  n_stochastic: 1
  latent_stats: cached/latent_stats.npz
  output_dir: /mnt/ceph/users/mliu1/latent_pipeline_cache/synth_ne_vel_T
  sources:
  - name: IllustrisTNG_LH128
    nbody_path: /mnt/home/camels/ceph/PUBLIC_RELEASE/CMD/3D_grids/data/Nbody/Grids_Mtot_Nbody_IllustrisTNG_LH_128_z=0.0.npy
    mgas_path: /mnt/ceph/users/camels/PUBLIC_RELEASE/CMD/3D_grids/data/IllustrisTNG/Grids_Mgas_IllustrisTNG_LH_128_z=0.0.npy
    param_path: /mnt/ceph/users/camels/PUBLIC_RELEASE/CMD/3D_grids/data/IllustrisTNG/params_LH_IllustrisTNG.txt
    n_samples: null
    ne_path: /mnt/home/camels/ceph/PUBLIC_RELEASE/CMD/3D_grids/data/IllustrisTNG/Grids_ne_IllustrisTNG_LH_128_z=0.0.npy
    t_path: /mnt/home/camels/ceph/PUBLIC_RELEASE/CMD/3D_grids/data/IllustrisTNG/Grids_T_IllustrisTNG_LH_128_z=0.0.npy
    vel_path: /mnt/home/mliu1/ceph/CAMELS-L25n256/Nbody/Grids_Vcdm_Nbody_IllustrisTNG_LH_128_z=0.0.npy
  - name: Astrid_LH128
    nbody_path: /mnt/home/camels/ceph/PUBLIC_RELEASE/CMD/3D_grids/data/Nbody/Grids_Mtot_Nbody_Astrid_LH_128_z=0.0.npy
    mgas_path: /mnt/ceph/users/camels/PUBLIC_RELEASE/CMD/3D_grids/data/Astrid/Grids_Mgas_Astrid_LH_128_z=0.0.npy
    param_path: /mnt/ceph/users/camels/PUBLIC_RELEASE/CMD/3D_grids/data/Astrid/params_LH_Astrid.txt
    n_samples: null
    ne_path: /mnt/home/camels/ceph/PUBLIC_RELEASE/CMD/3D_grids/data/Astrid/Grids_ne_Astrid_LH_128_z=0.0.npy
    t_path: /mnt/home/camels/ceph/PUBLIC_RELEASE/CMD/3D_grids/data/Astrid/Grids_T_Astrid_LH_128_z=0.0.npy
    vel_path: /mnt/home/mliu1/ceph/CAMELS-L25n256/Nbody/Grids_Vcdm_Nbody_Astrid_LH_128_z=0.0.npy
  - name: SIMBA_LH128
    nbody_path: /mnt/home/camels/ceph/PUBLIC_RELEASE/CMD/3D_grids/data/Nbody/Grids_Mtot_Nbody_SIMBA_LH_128_z=0.0.npy
    mgas_path: /mnt/ceph/users/camels/PUBLIC_RELEASE/CMD/3D_grids/data/SIMBA/Grids_Mgas_SIMBA_LH_128_z=0.0.npy
    param_path: /mnt/ceph/users/camels/PUBLIC_RELEASE/CMD/3D_grids/data/SIMBA/params_LH_SIMBA.txt
    n_samples: null
    ne_path: /mnt/home/camels/ceph/PUBLIC_RELEASE/CMD/3D_grids/data/SIMBA/Grids_ne_SIMBA_LH_128_z=0.0.npy
    t_path: /mnt/home/camels/ceph/PUBLIC_RELEASE/CMD/3D_grids/data/SIMBA/Grids_T_SIMBA_LH_128_z=0.0.npy
    vel_path: /mnt/home/mliu1/ceph/CAMELS-L25n256/Nbody/Grids_Vcdm_Nbody_SIMBA_LH_128_z=0.0.npy
nf:
  data:
    mode: real
    suites:
    - IllustrisTNG
    - Astrid
    - SIMBA
    n_cosmo: 2
    norm3d_path: /mnt/home/mliu1/ceph/norm3d.npy
    mgas_path_tmpl: /mnt/ceph/users/camels/PUBLIC_RELEASE/CMD/3D_grids/data/{suite}/Grids_Mgas_{suite}_LH_128_z=0.0.npy
    param_path_tmpl: /mnt/ceph/users/camels/PUBLIC_RELEASE/CMD/3D_grids/data/{suite}/params_LH_{suite}.txt
    synth_dir_tmpl: /mnt/ceph/users/mliu1/latent_pipeline_cache/synth_ne_vel_T/{suite}_LH128
    val_split: 0.2
  model:
    base_channels: 4
    num_params: 2
    flow_hidden: 128
    flow_transforms: 4
    flow_type: nsf
    flow_bins: 8
    dropout: 0.15
    summary_dim: 6
    circular_padding: true
  training:
    lr_encoder: 0.0003
    lr_flow: 0.0001
    weight_decay: 0.0001
    warmup_epochs: 20
    flow_warmup_epochs: 50
    early_stop_patience: 80
    max_epochs: 1500
    batch_size: 8
    num_workers: 4
    accumulate_grad_batches: 2
    precision: bf16-mixed
    devices: 4
    strategy: ddp
    gradient_clip_val: 0.5
    log_every_n_steps: 10
    aux_loss_weight: 0.5
    aux_loss_decay: 1.0
    input_noise_std: 0.0
    skip_nan_loss: true
    checkpoint_dir: nf_checkpoints
    resume_from: null
    wandb_project: latent-pipeline-nf
    seed: 42
    plot_every_n_epochs: 5
  inference:
    checkpoint: null
    n_posterior_samples: 2000
    batch_size: 2
    dpi: 150
    output_dir: outputs/nf_inference
    param_names:
    - $\Omega_m$
    - $\sigma_8$
  heldout:
    name: Magneticum
    mgas_path: /mnt/ceph/users/mliu1/CAMELS-L25n256/Grids_Mgas_Magneticum_LH_128_z=0.0.npy
    param_path: /mnt/ceph/users/mliu1/CAMELS-L25n256/params_LH_Magneticum.txt
    n_cosmo: 2
